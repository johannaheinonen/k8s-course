apiVersion: v1
kind: Namespace
metadata:
  name: test-app-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: test-app-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app-1
  template:
    metadata:
      labels:
        app: test-app-1
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: test-app-1-svc
  namespace: test-app-1
spec:
  type: LoadBalancer
  selector:
    app: test-app-1
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
